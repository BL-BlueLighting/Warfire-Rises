name: Build

# Produces installable packages for all three desktop platforms:
#   Windows  .exe  (NSIS installer)
#   macOS    .dmg  (Apple Silicon)
#   Linux    .deb
#
# Every push builds and uploads them as artefacts. Pushing a v* tag additionally
# publishes a Release whose notes follow the house template — see the `release`
# job for the body it generates.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            label: Linux (.deb)
            bundles: deb
          - platform: windows-latest
            label: Windows (.exe)
            bundles: nsis
          - platform: macos-latest
            label: macOS (.dmg)
            bundles: dmg

    steps:
      - uses: actions/checkout@v4

      # Tauri on Linux needs WebKitGTK and the AppIndicator stack.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Builds only. The release is assembled by the `release` job, which needs
      # every platform's artefacts in hand before it can hash them.
      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: warfire-rises-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Only a tag push publishes. Everything else stops at artefacts.
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the notes can list the commits this tag introduces.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release notes
        run: |
          set -euo pipefail

          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          REPO="$GITHUB_REPOSITORY"

          # Commits introduced by this tag: everything since the previous one,
          # or the whole history if this is the first.
          PREV="$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -1 || true)"
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${TAG}"
          else
            RANGE="$TAG"
          fi

          {
            echo '<div align="center">'
            echo "    <img src=\"https://raw.githubusercontent.com/${REPO}/${TAG}/Logo.png\" alt=\"Warfire Rises\" />"
            echo '    <h1>Warfire Rises</h1>'
            echo "    <p>战火升腾 - ${VERSION}</p>"
            echo '</div>'
            echo
            echo '# What'"'"'s New? / 什么更新了？'
            echo
            git log --pretty=format:'- `%h` %s' --reverse "$RANGE"
            echo
            echo
            echo '# Files / 文件'
            echo
            # Sorted so the order is stable between runs.
            find artifacts -type f | sort | while read -r f; do
              name="$(basename "$f")"
              bytes="$(stat -c%s "$f")"
              human="$(awk -v b="$bytes" 'BEGIN { if (b >= 1048576) printf "%.2f MB", b/1048576; else printf "%.0f KB", b/1024 }')"
              sum="$(sha256sum "$f" | cut -d' ' -f1)"
              echo "- \`${name}\` - ${human} - \`${sum}\`"
            done
          } > release-body.md

          echo "----- release-body.md -----"
          cat release-body.md

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Collect every installer the build jobs produced.
          mapfile -t FILES < <(find artifacts -type f | sort)
          gh release create "$GITHUB_REF_NAME" \
            --title "WARFIRE RISES $GITHUB_REF_NAME" \
            --notes-file release-body.md \
            "${FILES[@]}"
