[package]
name = "warfire-rises"
version = "2.0.0"
description = "WARFIRE RISES — A HOI4-style world simulation game"
authors = ["Warfire Rises"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The Tauri mobile entry point requires a library crate.
name = "warfire_rises_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The webview cannot fetch news.google.com itself: no CORS headers, so the
# request is blocked before it leaves. Rust has no such restriction.
# rustls rather than native-tls keeps the build free of an OpenSSL dependency.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "brotli",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
