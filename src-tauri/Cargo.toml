[package]
name = "warfire-rises"
version = "2.0.0"
description = "WARFIRE RISES — A HOI4-style world simulation game"
authors = ["Warfire Rises"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The Tauri mobile entry point requires a library crate.
name = "warfire_rises_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
